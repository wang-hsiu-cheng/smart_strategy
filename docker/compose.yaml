name: RL
services:
  rl_main_dev:
    build:
      context: .
      args:
        USERNAME: user
    image: tedwang2/rl_main:1.2.2
    container_name: rl_main_dev
    stdin_open: true
    tty: true
    privileged: true
    stop_grace_period: 1s
    network_mode: host
    working_dir: /home/user/rl_main
    environment:
      - DISPLAY=host.docker.internal:0.0
      - XAUTHORITY=/root/.Xauthority
    volumes:
      # Mount X11 server
      - /d/.Xauthority:/root/.Xauthority
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Direct Rendering Infrastructure
      - /dev:/dev
      - ../:/home/user/rl_main

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
              
    command: /bin/bash
